# EddyFusion — 涡旋默认 Fair 线（V6 Phase B0）
# 与 config/eddy_v6_b0_fair.yaml 同口径：355/356 stem、[norm(ADT(t))]×3、OW P24
# 历史 cloud_fair 见 config/eddy_cloud_fair.yaml（归档对照，非默认）
meta:
  project: "EddyFusion"
  module: "eddy"
  version: "1.0-v6-b0-fair-default"
  level: 2   # 0/1/2/3 含义见《A09-最终技术方案与降级策略》
  seed: 42

paths:
  dataset_yaml: "AutoDL/dataset/eddy_v6_b0_fair/dataset.yaml"
  output_dir: "outputs/eddy_v6_b0_fair"

model:
  backbone: "yolov8n-seg"
  input_size: [640, 640]
  channels: 3

train:
  device: "cuda"
  epochs: 50
  batch_size: 4
  workers: 4
  amp: true
  pretrained: true
  run_name: train
  seed: 42
  lr0: 0.0025
  lrf: 0.01
  warmup_epochs: 12
  cos_lr: true
  close_mosaic: 20
  patience: 150
  mosaic: 0.25
  mixup: 0.0
  copy_paste: 0.0
  label_smoothing: 0.05
  degrees: 0.0
  translate: 0.05
  scale: 0.4
  fliplr: 0.5

eval:
  metrics_file: "outputs/eddy_v6_b0_fair/metrics_summary.json"
  save_preds: true

# 前端/演示推理增强（非训练超参，见 app/services/eddy_demo_service.py）
