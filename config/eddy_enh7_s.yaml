# 7ch + YOLOv8s（更大容量，随机初始化；val 仅 7 张，指标波动大）
meta:
  project: "EddyFusion"
  module: "eddy"
  version: "1.0-enh7-s"
  level: 2
  seed: 42

paths:
  dataset_yaml: "data/processed/eddy_enh7/dataset.yaml"
  output_dir: "outputs/eddy_enh7"

model:
  backbone: "yolov8s-seg"
  architecture_yaml: "yolov8s-seg.yaml"
  input_size: [640, 640]
  channels: 7

train:
  device: "cuda"
  epochs: 100
  batch_size: 3
  workers: 4
  amp: false
  pretrained: false
  run_name: train_s
  seed: 42
  lr0: 0.002
  lrf: 0.01
  warmup_epochs: 12
  cos_lr: true
  close_mosaic: 20
  patience: 150
  mosaic: 0.25
  mixup: 0.0
  copy_paste: 0.0
  label_smoothing: 0.05
  degrees: 0.0
  translate: 0.05
  scale: 0.4
  fliplr: 0.5

eval:
  metrics_file: "outputs/eddy_enh7/metrics_summary_s.json"
