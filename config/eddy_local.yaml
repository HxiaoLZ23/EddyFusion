# 3ch 基线 — 本地与 eddy_enh7 同环境对照（同划分、同超参，仅 channels=3 + COCO 预训练）
meta:
  project: "EddyFusion"
  module: "eddy"
  version: "1.0-local3ch"
  level: 2
  seed: 42

paths:
  dataset_yaml: "data/processed/eddy/dataset.yaml"
  output_dir: "outputs/eddy"

model:
  backbone: "yolov8n-seg"
  input_size: [640, 640]
  channels: 3

train:
  device: "cuda"
  epochs: 100
  batch_size: 4
  workers: 4
  amp: true
  pretrained: true
  run_name: train_local
  seed: 42
  lr0: 0.0025
  lrf: 0.01
  warmup_epochs: 12
  cos_lr: true
  close_mosaic: 20
  patience: 150
  mosaic: 0.25
  mixup: 0.0
  copy_paste: 0.0
  label_smoothing: 0.05
  degrees: 0.0
  translate: 0.05
  scale: 0.4
  fliplr: 0.5

eval:
  metrics_file: "outputs/eddy/metrics_summary_local.json"
